[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "audio2flm"
version = "0.1.0"
description = "Experimental direct audio-to-FL Studio Mobile converter with slide-note support"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "librosa>=0.10.2", "soundfile>=0.12"]

[project.scripts]
audio2flm = "audio2flm.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
